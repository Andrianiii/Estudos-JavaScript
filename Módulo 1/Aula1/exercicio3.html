<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        var numero = Number(prompt("Digite um numero: "))
        var numero2 = Number(prompt("Digite um numero: "))
        var conta = prompt("Escolha + - * /")

        if(conta === "+"){
            alert(numero + numero2)
        } else if(conta === "-"){
            alert(numero - numero2)
        } else if(conta === "*"){
            alert(numero * numero2)
        } else if(conta === "/"){
            alert(numero / numero2)
        }

    </script>
</body>
</html>
