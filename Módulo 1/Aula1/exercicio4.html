<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

    var idade = Number(prompt("Digite a sua idade: "))

    if(idade < 16){
        alert("Não vota")
    } else if(idade === 16 || idade === 17){
        alert("Voto opcional")
    } else{
        alert("Voto obrigatorio")
    }

    </script>
</body>
</html>
