<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Nota</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            padding: 24px; font-family: Arial, sans-serif;
            background: #eef2ff; color: #1f2937;
        }
        .container {
            width: 100%; max-width: 420px; padding: 32px;
            border-radius: 18px; background: #fff;
            box-shadow: 0 12px 35px rgba(31, 41, 55, .10);
        }
        h1 { margin: 0 0 10px; font-size: 1.7rem; color: #312e81; }
        p { line-height: 1.5; color: #64748b; }
        label { display: block; margin: 22px 0 8px; font-weight: 700; }
        input {
            width: 100%; padding: 13px 14px; border: 1px solid #cbd5e1;
            border-radius: 10px; font-size: 1rem;
        }
        input:focus { outline: 3px solid #c7d2fe; border-color: #6366f1; }
        button {
            width: 100%; margin-top: 16px; padding: 13px; border: 0;
            border-radius: 10px; background: #4f46e5; color: white;
            font-size: 1rem; font-weight: 700; cursor: pointer;
        }
        button:hover { background: #4338ca; }
        #resultado { min-height: 24px; margin: 20px 0 0; font-weight: 700; color: #312e81; }
    </style>
</head>
<body>
    <main class="container">
        <h1>Verificador de Nota</h1>
        <p>Digite sua nota para descobrir sua situação.</p>
        <label for="nota">Sua nota (0 a 10)</label>
        <input id="nota" type="number" min="0" max="10" step="1" placeholder="Ex.: 8">
        <button id="botao" type="button">Verificar nota</button>
        <p id="resultado" aria-live="polite">O resultado aparecerá aqui.</p>
    </main>
    <script src="exercicio1.js"></script>
</body>
</html>
